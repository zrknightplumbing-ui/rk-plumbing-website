<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">RK Plumbing LLC Licensed Master Plumber</title>
<desc id="desc">Blue and navy RK Plumbing LLC logo with a house, plumbing pipes, water drop, and Licensed Master Plumber tagline.</desc>
<defs>
  <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b3154"/><stop offset=".55" stop-color="#0d5c91"/><stop offset="1" stop-color="#0b2f52"/></linearGradient>
  <linearGradient id="drop" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#53c7ff"/><stop offset="1" stop-color="#0075c9"/></linearGradient>
</defs>
<rect width="1200" height="600" fill="#fff"/>
<!-- house -->
<path d="M285 185 L600 48 L915 185" fill="none" stroke="#0b3154" stroke-width="26" stroke-linejoin="round"/>
<path d="M350 170 V270 M850 170 V270" fill="none" stroke="#0b3154" stroke-width="26"/>
<path d="M505 128h58v58h-58zM637 128h58v58h-58zM505 198h58v58h-58zM637 198h58v58h-58z" fill="#0b3154"/>
<!-- pipe -->
<path d="M70 330 V275 Q70 245 100 245 H300" fill="none" stroke="#0b3154" stroke-width="34" stroke-linecap="round"/>
<path d="M1130 330 V275 Q1130 245 1100 245 H900" fill="none" stroke="#0b3154" stroke-width="34" stroke-linecap="round"/>
<path d="M70 330 V370 H300" fill="none" stroke="#0b3154" stroke-width="34" stroke-linecap="round"/>
<path d="M1130 330 V370 H900" fill="none" stroke="#0b3154" stroke-width="34" stroke-linecap="round"/>
<!-- RK -->
<text x="365" y="405" font-family="Arial,Helvetica,sans-serif" font-size="245" font-weight="900" letter-spacing="-22" fill="url(#blue)">RK</text>
<!-- water drop -->
<path d="M455 220 C455 220 405 285 405 320 C405 350 428 372 455 372 C482 372 505 350 505 320 C505 285 455 220 455 220Z" fill="url(#drop)" stroke="#fff" stroke-width="9"/>
<path d="M435 310 C440 290 449 276 460 264" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
<!-- pipe line -->
<path d="M55 430 H1145" stroke="#0b3154" stroke-width="12"/>
<!-- company name -->
<text x="600" y="492" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="900" letter-spacing="8" fill="#0b3154">PLUMBING LLC</text>
<text x="600" y="558" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" letter-spacing="9" fill="#0b3154">LICENSED MASTER PLUMBER</text>
<rect x="58" y="535" width="145" height="8" fill="#b65a27"/><rect x="997" y="535" width="145" height="8" fill="#b65a27"/>
</svg>